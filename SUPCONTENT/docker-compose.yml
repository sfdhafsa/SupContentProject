services:
  database:
    image: postgres:16
    container_name: supcontent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: supcontent
      POSTGRES_PASSWORD: supcontent123
      POSTGRES_DB: supcontent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: supcontent_backend
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: supcontent
      DB_USER: supcontent
      DB_PASSWORD: supcontent123
      NODE_ENV: development
  pgadmin:
    image: dpage/pgadmin4
    container_name: supcontent_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@supcontent.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - database

volumes:
  postgres_data: