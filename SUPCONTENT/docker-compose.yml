
services:
  database:
    image: postgres:16
    container_name: supcontent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: supcontent_backend
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-supcontent}
      DB_USER: ${DB_USER:-supcontent}
      DB_PASSWORD: ${DB_PASSWORD}

      # TMDB
      TMDB_BASE_URL: https://api.themoviedb.org/3/
      TMDB_API_KEY: b03e5f732d2f22743b4550808c2ccf2f
      
      # If using Docker secrets, the secret will be available at /run/secrets/db_password
      # Update your app to prefer reading /run/secrets/db_password when present.
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/auth/google/callback}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      MOBILE_CLIENT_URL: ${MOBILE_CLIENT_URL:-supcontent://auth/callback}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_EHLO_DOMAIN: ${SMTP_EHLO_DOMAIN:-localhost}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/api/auth/github/callback}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:3000/api/auth/facebook/callback}
    secrets:
      - db_password

  web-client:
    build:
      context: .
      dockerfile: docker/webclient/Dockerfile
    container_name: supcontent_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./web-client:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_API_PROXY_TARGET: http://backend:3000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  pgadmin:
    image: dpage/pgadmin4
    container_name: supcontent_pgadmin
    restart: unless-stopped
    # For local development, set PGAdmin credentials in the .env file (see .env.example).
    # For production, prefer Docker secrets and an entrypoint that injects secrets
    # as environment variables if needed by the image.
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@supcontent.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - database
    secrets:
      - pgadmin_password

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  db_password:
    file: ./secrets/db_password.txt
  pgadmin_password:
    file: ./secrets/db_password.txt
